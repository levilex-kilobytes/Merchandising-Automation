openapi: 3.0.3
info: { title: Sales Audit API, version: 1.0.0 }
servers: [{ url: 'http://localhost:3007/api/v1' }]
paths:
  /health: { get: { responses: { '200': { description: OK } } } }
  /registers: { get: { responses: { '200': { description: OK } } } }
  /register-sessions:
    get:  { responses: { '200': { description: OK } } }
    post: { responses: { '201': { description: Created } } }
  /register-sessions/{id}: { get: { responses: { '200': { description: OK } } } }
  /register-sessions/{id}/count:
    post: { responses: { '200': { description: OK } } }
  /register-sessions/{id}/close:
    post: { responses: { '200': { description: OK } } }
  /discrepancies: { get: { responses: { '200': { description: OK } } } }
