openapi: 3.0.3
info:
  title: Inventory API
  version: 1.0.0
servers:
  - url: http://localhost:3004/api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200': { description: OK }
  /stock:
    get:
      summary: List stock items
      responses:
        '200': { description: OK }
  /stock/{productCode}/{locationCode}:
    get:
      summary: Get a stock item
      parameters:
        - { in: path, name: productCode, required: true, schema: { type: string } }
        - { in: path, name: locationCode, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /stock/adjust:
    post:
      summary: Adjust stock
      responses:
        '200': { description: OK }
  /movements:
    get:
      summary: List movements
      responses:
        '200': { description: OK }
  /locations:
    get:
      summary: List locations
      responses:
        '200': { description: OK }
