openapi: 3.0.3
info:
  title: Procurement API
  version: 1.0.0
servers:
  - url: http://localhost:3002/api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200': { description: OK }
  /purchase-orders:
    get:
      summary: List purchase orders
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: supplierId
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
    post:
      summary: Create purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePurchaseOrder' }
      responses:
        '201': { description: Created }
  /purchase-orders/{id}:
    get:
      summary: Get purchase order
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
  /purchase-orders/{id}/submit:
    post:
      summary: Submit for approval
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
  /purchase-orders/{id}/approve:
    post:
      summary: Approve a purchase order
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvedBy]
              properties:
                approvedBy: { type: string }
                note: { type: string }
      responses:
        '200': { description: OK }
  /purchase-orders/{id}/send:
    post:
      summary: Mark as sent to supplier
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
  /purchase-orders/{id}/close:
    post:
      summary: Close purchase order
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
  /purchase-orders/{id}/cancel:
    post:
      summary: Cancel purchase order
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: OK }
components:
  schemas:
    CreatePurchaseOrder:
      type: object
      required: [supplierId, currency, expectedDate, lines]
      properties:
        supplierId: { type: string, format: uuid }
        currency: { type: string, minLength: 3, maxLength: 3 }
        expectedDate: { type: string, format: date }
        notes: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [productCode, quantity]
            properties:
              productCode: { type: string }
              quantity: { type: integer, minimum: 1 }
