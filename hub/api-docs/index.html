<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Documentation · MMS</title>
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #0f172a;
  }

  .topbar {
    background: #0f172a;
    color: #fff;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    padding: 10px 20px;
  }

  .header {
    border-bottom: 1px solid #e5e7eb;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }

  .brand-mark { color: #ea580c; }

  .nav-back {
    margin-left: auto;
    font-size: 13px;
    font-weight: 600;
    color: #ea580c;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 8px;
  }
  .nav-back:hover { background: #fff7ed; }

  .selector-bar {
    padding: 16px 32px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fafafa;
  }

  .selector-bar label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #64748b;
  }

  .selector-bar select {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #fff;
    color: #0f172a;
    min-width: 260px;
    cursor: pointer;
  }
  .selector-bar select:focus {
    outline: none;
    border-color: #ea580c;
    box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15);
  }

  .service-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 16px 32px;
    border-bottom: 1px solid #e5e7eb;
  }

  .service-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 600;
    color: #0f172a;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .service-chip:hover { border-color: #ea580c; }
  .service-chip.active {
    background: #ea580c;
    border-color: #ea580c;
    color: #fff;
  }

  #swagger-ui { padding: 0 32px 48px; }

  /* Tame Swagger UI's default styles */
  .swagger-ui .topbar { display: none; }
  .swagger-ui .info { margin: 24px 0; }
  .swagger-ui .info .title { font-family: inherit; }
  .swagger-ui .scheme-container { box-shadow: none; background: none; padding: 0; }
  .swagger-ui .opblock-tag { font-family: inherit; }
</style>
</head>
<body>

<div class="topbar">
  <span>Merchandise Management System · API Reference</span>
</div>

<header class="header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-6 9 6v10a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2z"/>
      </svg>
    </span>
    <span>MMS API Docs</span>
  </div>
  <a class="nav-back" href="/">← Back to hub</a>
</header>

<div class="selector-bar">
  <label for="svc-select">Service</label>
  <select id="svc-select"></select>
</div>

<div class="service-list" id="service-list"></div>

<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script>
(function () {
  var SPECS = [
    { name: 'Vendor Management',    file: 'vendor-management.yaml', prefix: 'vendor' },
    { name: 'Procurement',          file: 'procurement.yaml',        prefix: 'procurement' },
    { name: 'Receiving',            file: 'receiving.yaml',          prefix: 'receiving' },
    { name: 'Inventory',            file: 'inventory.yaml',          prefix: 'inventory' },
    { name: 'Warehouse Operations', file: 'warehouse.yaml',          prefix: 'warehouse' },
    { name: 'Retail Sales (POS)',   file: 'retail-sales.yaml',       prefix: 'pos' },
    { name: 'Sales Audit',          file: 'sales-audit.yaml',        prefix: 'audit' },
    { name: 'Financials',           file: 'financials.yaml',         prefix: 'finance' }
  ];

  var select = document.getElementById('svc-select');
  var list = document.getElementById('service-list');

  SPECS.forEach(function (s, i) {
    var opt = document.createElement('option');
    opt.value = s.file;
    opt.textContent = s.name;
    select.appendChild(opt);

    var chip = document.createElement('button');
    chip.className = 'service-chip';
    chip.dataset.file = s.file;
    chip.textContent = s.name;
    chip.addEventListener('click', function () { load(s.file); });
    list.appendChild(chip);
  });

  function load(file) {
    select.value = file;
    document.querySelectorAll('.service-chip').forEach(function (c) {
      c.classList.toggle('active', c.dataset.file === file);
    });

    if (window.ui) {
      window.ui.spec = null;
    }

    window.ui = SwaggerUIBundle({
      url: 'specs/' + file,
      dom_id: '#swagger-ui',
      deepLinking: true,
      docExpansion: 'list',
      defaultModelsExpandDepth: 0,
      tryItOutEnabled: true,
      presets: [SwaggerUIBundle.presets.apis]
    });
  }

  select.addEventListener('change', function () { load(this.value); });

  load(SPECS[0].file);
})();
</script>

</body>
</html>
